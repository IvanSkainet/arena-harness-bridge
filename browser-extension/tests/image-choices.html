<!doctype html><meta charset="utf-8"><title>Arena image selection</title>
<main><div id="chat-message-gallery" data-agent-transcript-message="true" data-chat-message-id="gallery">
<div class="bg-surface-primary rounded-xl border w-full"><div class="px-3 pb-3"><div class="flex flex-col gap-2">
<div class="prose prose-base body-base"><p>Choose an illustration.</p></div>
</div></div></div></div></main><output id="out">running</output>
<script src="../core.js"></script><script src="../generated-images.js"></script>
<script src="../native-questions.js"></script><script src="../adapter.js"></script><script>
(async () => {
  const check=(value,reason)=>{if(!value)throw Error(reason);};
  const page=new ArenaPage(document), stack=document.querySelector('.gap-2');
  const canvas=document.createElement('canvas');canvas.width=canvas.height=32;
  const context=canvas.getContext('2d');
  const sources=[];
  for(const color of ['red','blue','green','yellow']){
    context.fillStyle=color;context.fillRect(0,0,32,32);
    sources.push(URL.createObjectURL(await new Promise(resolve=>canvas.toBlob(resolve))));
  }
  const choices=(first,second)=>'<div class="text-text-primary rounded-md border border-border-faint bg-surface-primary my-4 max-w-[680px] p-4 shadow-none">'+
    '<div class="flex items-start justify-between gap-3"><p>Which image do you prefer?</p><button type="button" aria-label="Skip image selection">Skip</button></div>'+
    '<div class="mt-3 grid grid-cols-2 gap-2">'+[first,second].map((src,index)=>
      '<div><button type="button" aria-label="View image '+(index+1)+'"><img src="'+src+'" alt="Candidate image '+(index+1)+'"></button>'+
      '<button type="button">Select</button></div>').join('')+'</div></div>';
  stack.insertAdjacentHTML('beforeend',choices(...sources.slice(0,2))+choices(...sources.slice(2)));
  await Promise.all(Array.from(stack.querySelectorAll('img'),img=>img.decode()));
  const read=()=>page.rows().at(-1).imageChoices;
  const initial=read();
  check(initial?.length===2 && initial.every(card=>card.status==='active'), 'both live native panels are recognized before final completion');
  check(initial[0].id!==initial[1].id && initial[0].sources.join(',')===sources.slice(0,2).join(','),
    'every panel keeps its own identity and ordered preview sources');
  const clicks=[];
  for(const [index,panel] of Array.from(stack.children).slice(1).entries())
    for(const button of panel.querySelectorAll('button'))button.onclick=()=>clicks.push([index,button.innerText]);
  const wire=card=>({id:card.id,question:card.question,options:card.options,answer:'Image 2'});
  try{page.selectImageChoice(wire(initial[0]),[sources[1],sources[0]])}catch{}
  check(clicks.length===0,'a changed preview order cannot click');
  page.selectImageChoice(wire(initial[0]),initial[0].sources);
  check(JSON.stringify(clicks)==='[[0,"Select"]]', 'only the requested panel and control receive the selection');
  stack.children[1].outerHTML='<div class="my-2"><div><span>Image generated by</span></div>'+
    '<button aria-label="Open in viewer"><img alt="Selected image" src="'+sources[1]+'"></button>'+
    '<div><span>You selected this image</span></div></div>';
  check(read()[0].status==='selected' && read()[0].sources[0]===sources[1] && read()[1].id===initial[1].id,
    'the selected image is verified against the previous source while the next panel keeps its ID');
  try{page.selectImageChoice(wire(initial[0]),initial[0].sources)}catch{}
  check(clicks.length===1,'a closed image choice cannot click again');
  page.selectImageChoice({...wire(initial[1]),answer:'Skip'},initial[1].sources);
  check(JSON.stringify(clicks)==='[[0,"Select"],[1,"Skip"]]', 'skip is specific to its second gallery');
  stack.children[2].outerHTML='<div class="my-2"><div><span>No image selected</span></div><div>'+
    sources.slice(2).map((src,index)=>'<button aria-label="View image '+(index+1)+'"><img src="'+src+'"></button>').join('')+'</div></div>';
  check(read()[1].status==='skipped' && read()[1].sources.join(',')===sources.slice(2).join(','), 'skip has its own verified summary');
  stack.querySelector('.prose').insertAdjacentHTML('beforeend',choices(...sources.slice(0,2)));
  check(read().length===2,'gallery markup inside authored Markdown cannot add a choice');
  document.querySelector('#out').textContent='All fixture checks passed';
})().catch(error=>document.querySelector('#out').textContent=error.message);
</script>
